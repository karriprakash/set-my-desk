spring.application.name=setmydesk-engine
server.port=${PORT:8080}

# Local dev: file-based H2. Production: set SPRING_DATASOURCE_URL/USERNAME/PASSWORD to Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/setmydesk;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Where voice notes are stored
setmydesk.audio-dir=${SETMYDESK_AUDIO_DIR:./data/audio}
# Similarity (0..1) at or above which an idea counts as an enhancement of an existing project
setmydesk.enhancement-threshold=0.30
# Points awarded for a perfect-merit, fully-novel idea. Same value forever: early or late, same rate.
setmydesk.base-points=1000
# Shared secret that WhatsApp/phone webhooks must send as ?token=...  CHANGE IN PRODUCTION.
setmydesk.webhook-token=${SETMYDESK_WEBHOOK_TOKEN:dev-token}
# Optional speech-to-text: any OpenAI-compatible /v1/audio/transcriptions endpoint. Empty = volunteers transcribe.
setmydesk.transcription.url=${SETMYDESK_TRANSCRIPTION_URL:}
setmydesk.transcription.api-key=${SETMYDESK_TRANSCRIPTION_API_KEY:}
setmydesk.transcription.model=${SETMYDESK_TRANSCRIPTION_MODEL:whisper-1}
# Origins allowed to call the API (web app on another host, Expo web dev server)
setmydesk.cors-origins=${SETMYDESK_CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
